services:
  feedbot:
    image: ${FEEDBOT_IMAGE:-ghcr.io/congmiaofactory/congmiao-feedbot:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NETEASE_API_BASE: http://netease-api:3000
    volumes:
      - feedbot-data:/app/data
      - ./secrets:/app/secrets:ro
    depends_on:
      netease-api:
        condition: service_started
    ports:
      - "${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"

  netease-api:
    image: ${NETEASE_API_IMAGE:-moefurina/ncm-api:latest}
    restart: unless-stopped
    environment:
      PORT: 3000
      ENABLE_GENERAL_UNBLOCK: ${NETEASE_ENABLE_GENERAL_UNBLOCK:-true}
      ENABLE_FLAC: ${NETEASE_ENABLE_FLAC:-true}

  telegram-bot-api:
    image: ${TELEGRAM_BOT_API_IMAGE:-aiogram/telegram-bot-api:latest}
    restart: unless-stopped
    profiles: ["telegram-local"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "127.0.0.1:${TELEGRAM_API_PORT:-8081}:8081"

volumes:
  feedbot-data:
  telegram-bot-api-data:
