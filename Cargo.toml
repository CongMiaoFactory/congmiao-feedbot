[package]
name = "congmiao-feedbot"
version = "0.2.13"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
description = "Multi-source Telegram feed parser for X, YouTube, Pixiv, Bilibili and NetEase Cloud Music"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies", "gzip", "brotli", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
teloxide = { version = "0.17", default-features = false, features = ["macros", "ctrlc_handler", "rustls", "webhooks-axum", "throttle"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
