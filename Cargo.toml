[workspace]
resolver = "2"
members = [
    ".",
    "crates/core",
    "crates/extractors",
    "crates/media",
    "crates/store",
    "crates/bot",
    "crates/feed",
    "crates/sites/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
governor = "0.8"
hex = "0.4"
http = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = { version = "2", features = ["serde"] }
md5 = { package = "md-5", version = "0.10" }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "cookies", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "time", "uuid"] }
strsim = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

teloxide = { version = "0.17", default-features = false, features = [
    "rustls",
    "throttle",
    "cache-me",
    "macros",
    "webhooks-axum",
    "tracing",
] }

feedbot-core = { path = "crates/core" }
feedbot-extractors = { path = "crates/extractors" }
feedbot-media = { path = "crates/media" }
feedbot-store = { path = "crates/store" }
feedbot-bot = { path = "crates/bot" }
feedbot-feed = { path = "crates/feed" }
feedbot-site-common = { path = "crates/sites/common" }
feedbot-bilibili = { path = "crates/sites/bilibili" }
feedbot-netease = { path = "crates/sites/netease" }
feedbot-pixiv = { path = "crates/sites/pixiv" }
feedbot-x = { path = "crates/sites/x" }
feedbot-youtube = { path = "crates/sites/youtube" }

[package]
name = "feedbot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Telegram bot that extracts media from website links and pushes subscribed feeds"

[[bin]]
name = "feedbot"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
feedbot-bot.workspace = true
feedbot-core.workspace = true
feedbot-extractors.workspace = true
feedbot-feed.workspace = true
feedbot-media.workspace = true
feedbot-store.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
config.workspace = true
serde.workspace = true
url.workspace = true
hex.workspace = true
teloxide.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
